name: Sync catalog
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/sync-tmdb.mjs
      - .github/workflows/sync-catalog.yml
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build catalog
        run: node scripts/sync-tmdb.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Commit catalog and details
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/details data/anime-details data/seasons data/source-registry.json
          git diff --cached --quiet || git commit -m "chore: sync multi-source catalog"
          git push
